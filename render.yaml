services:
  - type: web
    name: pool-duel
    runtime: node
    plan: free
    region: singapore
    buildCommand: echo "zero dependencies"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "26.12.1"
      - key: ALLOW_ORIGIN
        sync: false
